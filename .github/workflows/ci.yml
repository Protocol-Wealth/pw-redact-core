name: CI

on:
  workflow_dispatch:  # Manual only — pw-redact is discontinued (replaced by pw-os PII guard)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install 'ruff>=0.7.0'
      - name: Lint check
        run: ruff check src/
      - name: Format check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    env:
      SPACY_MODEL_WHEEL: en_core_web_lg-3.8.0-py3-none-any.whl
      # sha256 of the release asset above (400658291 bytes). Checked on every
      # run, cached or not, before pip installs it.
      SPACY_MODEL_SHA256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `spacy download` pip-installs a wheel into site-packages, so caching
      # ~/.cache/spacy never hit. Cache the pinned model wheel itself and
      # install it from disk; pip's own cache covers the other dependencies.
      - name: Cache spaCy model wheel
        id: spacy-wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/spacy-wheels
          key: spacy-wheel-${{ env.SPACY_MODEL_WHEEL }}

      - name: Download spaCy model wheel
        if: steps.spacy-wheel.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/spacy-wheels
          curl -fsSL --retry 3 -o ~/.cache/spacy-wheels/$SPACY_MODEL_WHEEL \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/$SPACY_MODEL_WHEEL"

      - name: Verify spaCy model wheel
        run: echo "$SPACY_MODEL_SHA256  $HOME/.cache/spacy-wheels/$SPACY_MODEL_WHEEL" | sha256sum -c -

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" pytest-cov
          pip install ~/.cache/spacy-wheels/$SPACY_MODEL_WHEEL

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=pw_redact --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
